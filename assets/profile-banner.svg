<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Nguyen Duc Bao Trung — Software Engineering Student</title>
  <desc id="description">An animated dark blue and violet banner introducing Nguyen Duc Bao Trung as a .NET and React developer.</desc>

  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.5" stop-color="#10214A"/>
      <stop offset="1" stop-color="#25134A"/>
    </linearGradient>
    <linearGradient id="accent" x1="300" y1="80" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="orbBlue">
      <stop stop-color="#38BDF8" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet">
      <stop stop-color="#A855F7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .orb-left { animation: drift-left 12s ease-in-out infinite alternate; }
    .orb-right { animation: drift-right 15s ease-in-out infinite alternate; }
    .pulse { animation: pulse 3.8s ease-in-out infinite; transform-origin: center; }
    .dash { animation: dash 12s linear infinite; }
    .fade-in { animation: fade-in 1.2s ease-out both; }
    .fade-in-late { animation: fade-in 1.2s 0.28s ease-out both; }

    @keyframes drift-left {
      from { transform: translate(-18px, -8px); }
      to { transform: translate(32px, 15px); }
    }
    @keyframes drift-right {
      from { transform: translate(20px, -15px); }
      to { transform: translate(-30px, 18px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.86); }
      50% { opacity: 1; transform: scale(1.16); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -180; }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb-left, .orb-right, .pulse, .dash, .fade-in, .fade-in-late { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle class="orb-left" cx="115" cy="70" r="230" fill="url(#orbBlue)"/>
    <circle class="orb-right" cx="1095" cy="270" r="270" fill="url(#orbViolet)"/>

    <path class="dash" d="M58 249C205 179 283 290 421 218C565 143 662 217 786 154C911 91 1002 157 1146 75" stroke="url(#accent)" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="8 12"/>
    <g fill="#E0F2FE" filter="url(#glow)">
      <circle class="pulse" cx="205" cy="206" r="4"/>
      <circle class="pulse" cx="421" cy="218" r="4" style="animation-delay: .7s"/>
      <circle class="pulse" cx="786" cy="154" r="4" style="animation-delay: 1.4s"/>
      <circle class="pulse" cx="1002" cy="137" r="4" style="animation-delay: 2.1s"/>
    </g>

    <g class="fade-in" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
      <text x="600" y="132" fill="#F8FAFC" font-size="48" font-weight="750" letter-spacing="0.4">NGUYEN DUC BAO TRUNG</text>
      <rect x="330" y="153" width="540" height="3" rx="1.5" fill="url(#accent)"/>
    </g>

    <g class="fade-in-late" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
      <text x="600" y="202" fill="#CBD5E1" font-size="23" font-weight="500" letter-spacing="1.2">SOFTWARE ENGINEERING STUDENT</text>
      <text x="600" y="244" fill="#93C5FD" font-size="18" font-weight="500">.NET + React  ·  Building dependable team software</text>
    </g>

    <rect x="1" y="1" width="1198" height="318" rx="23" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="2"/>
  </g>
</svg>
